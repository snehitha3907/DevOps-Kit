# last_verified: 2026-09-20 · Docker Swarm
#
# Production Docker Swarm stack manifest demonstrating secrets management,
# healthchecks, rolling update configuration, and resource limits.
# Deploy with: docker stack deploy -c production-swarm-stack.yaml <stack-name>
#
# Prerequisites:
#   - Docker Swarm initialized (docker swarm init)
#   - Secrets created (docker secret create) or use external secret drivers
#   - Overlay network available (docker network create -d overlay <name>)

version: "3.9"

services:
  # --- Reverse proxy / edge ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        failure_action: pause
        monitor: 30s
        max_failure_ratio: 0.1
        order: stop-first
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    secrets:
      - source: nginx-config
        target: /etc/nginx/nginx.conf
        mode: 0444
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Application API ---
  api:
    image: myapp/api:latest
    networks:
      - frontend
      - backend
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.50"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.2
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.2
        order: stop-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL_FILE: /run/secrets/postgres-url
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
    secrets:
      - source: postgres-url
        target: /run/secrets/postgres-url
        mode: 0400
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # --- Background worker ---
  worker:
    image: myapp/api:latest
    command: ["python", "-m", "worker"]
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.2
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: pause
        monitor: 60s
        max_failure_ratio: 0.2
        order: stop-first
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      DATABASE_URL_FILE: /run/secrets/postgres-url
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "4"
    secrets:
      - source: postgres-url
        target: /run/secrets/postgres-url
        mode: 0400
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
        reservations:
          cpus: "0.50"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        monitor: 120s
        max_failure_ratio: 0
        order: start-first
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres-user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_DB_FILE: /run/secrets/postgres-db
    secrets:
      - source: postgres-user
        target: /run/secrets/postgres-user
        mode: 0400
      - source: postgres-password
        target: /run/secrets/postgres-password
        mode: 0400
      - source: postgres-db
        target: /run/secrets/postgres-db
        mode: 0400
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --- Redis cache ---
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - backend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 192M
        reservations:
          cpus: "0.10"
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
        order: start-first
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Prometheus monitoring ---
  prometheus:
    image: prom/prometheus:latest
    networks:
      - backend
      - monitoring
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.1
        order: start-first
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
        mode: 0444
    volumes:
      - prometheus-data:/prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
    driver: overlay
    attachable: true
  backend:
    driver: overlay
    internal: true
  monitoring:
    driver: overlay
    attachable: true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local

secrets:
  nginx-config:
    external: true
  postgres-url:
    external: true
  postgres-user:
    external: true
  postgres-password:
    external: true
  postgres-db:
    external: true

configs:
  prometheus-config:
    external: true
