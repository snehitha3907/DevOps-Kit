# last_verified: 2026-11-08 · Docker Compose n/a
# app-postgres-healthchecks.compose.yaml — sample app + Postgres with health checks
#
# Run from a directory that contains the sample app image context, or replace
# `build: .` with an image you built in the previous lesson (e.g. sample-app:multistage).
#
# Usage:
#   docker compose -f app-postgres-healthchecks.compose.yaml up -d
#   docker compose -f app-postgres-healthchecks.compose.yaml ps

services:
  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data: