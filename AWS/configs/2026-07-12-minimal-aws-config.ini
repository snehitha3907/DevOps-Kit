; last_verified: 2026-07-12 · AWS CLI v2

; Default profile — used when no --profile flag is given
[default]
region = us-east-1
output = json

; Personal dev account
[profile dev]
region = us-west-2
output = json

; Work account (prod region)
[profile prod]
region = eu-west-1
output = json

; Sandbox for experiments
[profile sandbox]
region = us-east-1
output = text
