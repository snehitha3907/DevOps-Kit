name: lint
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck $(find . -name '*.sh' -not -path './.git/*')

      - name: ruff
        if: ${{ hashFiles('**/*.py') != '' }}
        run: |
          pip install ruff
          ruff check .
          ruff format --check .

      - name: yamllint
        if: ${{ hashFiles('**/*.yaml', '**/*.yml') != '' }}
        run: |
          pip install yamllint
          yamllint $(find . \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*')

      - name: terraform fmt
        if: ${{ hashFiles('**/*.tf') != '' }}
        run: |
          wget -q https://releases.hashicorp.com/terraform/1.7.0/terraform_1.7.0_linux_amd64.zip
          unzip -q terraform_1.7.0_linux_amd64.zip -d /usr/local/bin/
          terraform fmt -check -recursive .
