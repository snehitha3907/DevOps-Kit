# last_verified: 2026-10-25 · Cluster API v1.7.0
# Purpose: Azure managed cluster ClusterClass — AKS-style control plane with self-managed VMSS workers
# When to use: Production Azure workload clusters requiring full CAPI lifecycle management
# Prerequisites: CAPZ v1.7+ installed, Azure credentials configured, VNet/subnets exist
# Usage: clusterctl generate cluster <name> --from clusterclass/azure-managed-cluster --kubernetes-version v1.29.4
# Verify: kubectl get clusterclass azure-managed-cluster -o yaml
# Rollback: kubectl delete clusterclass azure-managed-cluster
# Common errors: Azure subscription limits; managed identity permissions; VNet peering not configured
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: azure-managed-cluster
  labels:
    cluster.x-k8s.io/provider: infrastructure-azure
    topology.cluster.x-k8s.io/managed: "true"
spec:
  variables:
    - name: kubernetesVersion
      description: "Kubernetes version for control plane and worker nodes"
      schema:
        type: string
        pattern: "^v?1\\.(2[89]|30)\\.[0-9]+$"
      default: "v1.29.4"
    - name: controlPlaneReplicas
      description: "Number of control plane replicas (must be odd)"
      schema:
        type: integer
        minimum: 1
        maximum: 5
      default: 3
    - name: workerReplicas
      description: "Number of worker node replicas"
      schema:
        type: integer
        minimum: 1
        maximum: 100
      default: 3
    - name: controlPlaneVMSize
      description: "Azure VM size for control plane nodes"
      schema:
        type: string
        enum: ["Standard_D4s_v5", "Standard_D8s_v5", "Standard_D16s_v5", "Standard_E4s_v5", "Standard_E8s_v5"]
      default: "Standard_D4s_v5"
    - name: workerVMSize
      description: "Azure VM size for worker nodes"
      schema:
        type: string
        enum: ["Standard_D4s_v5", "Standard_D8s_v5", "Standard_D16s_v5", "Standard_E4s_v5", "Standard_E8s_v5", "Standard_F4s_v2"]
      default: "Standard_D4s_v5"
    - name: vnetName
      description: "Existing VNet name"
      schema:
        type: string
    - name: vnetResourceGroup
      description: "Resource group containing the VNet"
      schema:
        type: string
    - name: controlPlaneSubnetName
      description: "Subnet for control plane nodes"
      schema:
        type: string
    - name: nodeSubnetName
      description: "Subnet for worker nodes"
      schema:
        type: string
    - name: cni
      description: "CNI plugin to deploy"
      schema:
        type: string
        enum: ["calico", "cilium", "azure-cni"]
      default: "azure-cni"
    - name: enableMonitoring
      description: "Deploy Prometheus monitoring stack"
      schema:
        type: boolean
      default: true
    - name: enableLogging
      description: "Deploy Loki logging stack"
      schema:
        type: boolean
      default: true
    - name: enableSecurity
      description: "Deploy Falco runtime security and Kyverno policies"
      schema:
        type: boolean
      default: true
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AzureClusterTemplate
      name: azure-managed-cluster
    namespace: capi-system
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: azure-managed-control-plane
    namespace: capi-system
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AzureMachineTemplate
        name: azure-control-plane
      namespace: capi-system
  workers:
    machineDeployments:
      - class: default-worker
        failureDomain: "${failureDomain}"
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: azure-worker-bootstrap
          namespace: capi-system
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AzureMachineTemplate
            name: azure-worker
          namespace: capi-system