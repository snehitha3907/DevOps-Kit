# last_verified: 2026-10-25 · Cluster API v1.7.0, CAPZ v1.7.0
# Purpose: Example Azure production cluster generated from azure-managed-cluster ClusterClass
# When to use: Reference for creating production Azure workload clusters
# Prerequisites: Azure credentials, VNet/subnets, ClusterClass azure-managed-cluster applied
# Usage: clusterctl generate cluster azure-prod --from clusterclass/azure-managed-cluster --kubernetes-version v1.29.4 > azure-prod.yaml
# Verify: kubectl apply -f azure-prod.yaml && kubectl get cluster azure-prod -n capi-workloads -w
# Rollback: kubectl delete cluster azure-prod -n capi-workloads
# Common errors: VNet/subnet in different resource group; managed identity missing permissions
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: azure-prod
  namespace: capi-workloads
  labels:
    cluster.x-k8s.io/provider: infrastructure-azure
    topology.cluster.x-k8s.io/managed: "true"
    cni: azure-cni
    csi: azure-disk
    monitoring: enabled
    logging: enabled
    security: enabled
    ingress: nginx
    environment: production
spec:
  topology:
    class: azure-managed-cluster
    version: v1.29.4
    controlPlane:
      replicas: 3
    workers:
      machineDeployments:
        - class: default-worker
          failureDomain: eastus-1
          replicas: 3
        - class: default-worker
          failureDomain: eastus-2
          replicas: 3
        - class: default-worker
          failureDomain: eastus-3
          replicas: 3
    variables:
      - name: kubernetesVersion
        value: v1.29.4
      - name: controlPlaneReplicas
        value: "3"
      - name: workerReplicas
        value: "9"
      - name: controlPlaneVMSize
        value: Standard_D8s_v5
      - name: workerVMSize
        value: Standard_D4s_v5
      - name: vnetName
        value: capi-vnet
      - name: vnetResourceGroup
        value: capi-network-rg
      - name: controlPlaneSubnetName
        value: controlplane-subnet
      - name: nodeSubnetName
        value: node-subnet
      - name: cni
        value: azure-cni
      - name: enableMonitoring
        value: "true"
      - name: enableLogging
        value: "true"
      - name: enableSecurity
        value: "true"
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: azure-staging
  namespace: capi-workloads
  labels:
    cluster.x-k8s.io/provider: infrastructure-azure
    topology.cluster.x-k8s.io/managed: "true"
    cni: azure-cni
    csi: azure-disk
    monitoring: enabled
    logging: enabled
    security: enabled
    ingress: nginx
    environment: staging
spec:
  topology:
    class: azure-managed-cluster
    version: v1.29.4
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - class: default-worker
          failureDomain: eastus-1
          replicas: 2
        - class: default-worker
          failureDomain: eastus-2
          replicas: 2
    variables:
      - name: kubernetesVersion
        value: v1.29.4
      - name: controlPlaneReplicas
        value: "1"
      - name: workerReplicas
        value: "4"
      - name: controlPlaneVMSize
        value: Standard_D4s_v5
      - name: workerVMSize
        value: Standard_D4s_v5
      - name: vnetName
        value: capi-vnet
      - name: vnetResourceGroup
        value: capi-network-rg
      - name: controlPlaneSubnetName
        value: controlplane-subnet
      - name: nodeSubnetName
        value: node-subnet
      - name: cni
        value: azure-cni
      - name: enableMonitoring
        value: "true"
      - name: enableLogging
        value: "true"
      - name: enableSecurity
        value: "true"