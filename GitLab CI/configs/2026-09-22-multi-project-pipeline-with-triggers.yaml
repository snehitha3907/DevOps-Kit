# last_verified: 2026-09-22 · GitLab CI (n/a)
# I wanted one template that wires an upstream pipeline to a downstream
# project, so I pieced together workflow rules + include + a trigger job.
# I kept tripping on job names in trigger examples, so I wrote down the
# exact shape that parsed for me. Drop this in as .gitlab-ci.yml and adjust
# the project paths to your own groups.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - local: templates/.common-jobs.yml
  - project: my-group/shared-ci-templates
    ref: main
    file: templates/docker-build.yml

stages:
  - build
  - test
  - trigger-downstream

build-job:
  stage: build
  script:
    - echo "Building $CI_PROJECT_NAME on $CI_COMMIT_SHORT_SHA"

test-job:
  stage: test
  script:
    - echo "Running tests for $CI_PROJECT_NAME"
  needs:
    - build-job

# I run this only on the default branch so feature pushes don't fire
# the downstream project. strategy: depend makes this pipeline wait on
# the downstream result instead of fire-and-forget.
trigger-downstream:
  stage: trigger-downstream
  trigger:
    project: my-group/downstream-project
    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - test-job
