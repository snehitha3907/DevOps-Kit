# last_verified: 2026-11-19 · Grafana 13.3.1
# Provision a Prometheus data source from a file. Drop this under
# /etc/grafana/provisioning/datasources/ (or point GF_DATASOURCES_PATH at the
# folder) and Grafana loads it at startup and keeps it in sync with the file.
# The uid is pinned so dashboards can reference it by name across environments.
apiVersion: 1
datasources:
  - name: Prometheus (main)
    type: prometheus
    access: proxy
    url: http://localhost:9090
    uid: prometheus-main
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
