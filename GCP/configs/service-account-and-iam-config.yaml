# last_verified: 2026-08-24 · GCP IAM · n/a
# gcp-008: service account and IAM configuration for automated deployments.

serviceAccount:
  id: ci-deployer
  displayName: CI Deployer
  description: Service account for CI pipeline artifact deployments.

iamPolicyBindings:
  - role: roles/storage.objectAdmin
    members:
      - serviceAccount:ci-deployer@PROJECT_ID.iam.gserviceaccount.com
  - role: roles/logging.logWriter
    members:
      - serviceAccount:ci-deployer@PROJECT_ID.iam.gserviceaccount.com

workloadIdentity:
  enabled: true
  pool: ci-pool
  provider: ci-provider
