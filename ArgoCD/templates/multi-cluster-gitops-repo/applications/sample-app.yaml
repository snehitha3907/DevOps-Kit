apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app
  namespace: argocd
  labels:
    argocd.argoproj.io/managed-by: argocd
    gitops.repo: multi-cluster-gitops
    application: sample-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    description: "Sample application demonstrating Kustomize overlay deployment"
spec:
  project: multi-cluster-gitops
  source:
    repoURL: https://github.com/your-org/multi-cluster-gitops-repo.git
    targetRevision: HEAD
    path: overlays/dev
    kustomize:
      namePrefix: sample-app-
      images:
        - nginx:latest
      commonLabels:
        application: sample-app
        managed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: applications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data