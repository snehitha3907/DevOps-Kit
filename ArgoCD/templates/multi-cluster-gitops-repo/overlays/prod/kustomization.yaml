apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: applications
resources:
  - ../../base
commonLabels:
  argocd.argoproj.io/managed-by: argocd
  gitops.repo: multi-cluster-gitops
  environment: prod
configMapGenerator:
  - name: env-config
    behavior: merge
    literals:
      - ENVIRONMENT=prod
      - LOG_LEVEL=warn
      - REPLICA_COUNT=3
      - RESOURCES_CPU_REQUEST=500m
      - RESOURCES_MEMORY_REQUEST=512Mi
      - RESOURCES_CPU_LIMIT=2000m
      - RESOURCES_MEMORY_LIMIT=2Gi