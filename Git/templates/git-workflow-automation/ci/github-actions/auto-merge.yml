# last_verified: 2026-10-25 · git n/a
# Auto-merge Workflow
# Place in .github/workflows/auto-merge.yml
#
# Automatically merges pull requests when all checks pass and
# the PR has the appropriate labels.

name: Auto Merge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (github.event.pull_request.labels.*.name contains 'auto-merge' ||
       github.event.pull_request.labels.*.name contains 'dependabot')
    steps:
      - name: Check required status checks
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.payload.pull_request;
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              per_page: 100
            });
            
            const requiredChecks = [
              'Test Suite',
              'Conventional Commits',
              'Security Scan'
            ];
            
            const conclusions = {};
            for (const check of checks.check_runs) {
              conclusions[check.name] = check.conclusion;
            }
            
            let allPassed = true;
            for (const required of requiredChecks) {
              const conclusion = conclusions[required];
              if (conclusion !== 'success' && conclusion !== 'neutral' && conclusion !== 'skipped') {
                console.log(`Required check "${required}" not passed: ${conclusion || 'missing'}`);
                allPassed = false;
              }
            }
            
            return allPassed;
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check branch protection
        id: branch-protection
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: branch } = await github.rest.repos.getBranchProtection({
              owner,
              repo,
              branch: context.payload.pull_request.base.ref
            });
            
            // Check if branch protection requires reviews
            if (branch.required_pull_request_reviews) {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: context.payload.pull_request.number
              });
              
              const approvedReviews = reviews.filter(r => r.state === 'APPROVED');
              const requiredApprovals = branch.required_pull_request_reviews.required_approving_review_count || 1;
              
              if (approvedReviews.length < requiredApprovals) {
                console.log(`Insufficient approvals: ${approvedReviews.length}/${requiredApprovals}`);
                return false;
              }
            }
            
            return true;
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.checks.outputs.result == 'true' && steps.branch-protection.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.payload.pull_request;
            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: number,
                merge_method: 'squash'
              });
              console.log('PR auto-merged successfully');
            } catch (error) {
              if (error.status === 405) {
                // Not mergeable yet, enable auto-merge instead
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: number,
                  merge_method: 'squash'
                });
                console.log('Auto-merge enabled, waiting for checks');
              } else {
                throw error;
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove auto-merge label on failure
        if: steps.checks.outputs.result != 'true' || steps.branch-protection.outputs.result != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.payload.pull_request;
            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number: number,
              name: 'auto-merge'
            });
            console.log('Removed auto-merge label due to failing checks');
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}