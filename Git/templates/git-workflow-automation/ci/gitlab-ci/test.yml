# last_verified: 2026-10-25 · git n/a
# GitLab CI Test Stage
# Place in .gitlab/ci/test.yml
#
# Test jobs for various languages and platforms.
# Included by .gitlab-ci.yml

# Node.js test
test:node:
  extends: .node
  stage: test
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - package.json

# Python test
test:python:
  extends: .python
  stage: test
  script:
    - pytest --cov=. --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\%\d*)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - pytest.ini
        - pyproject.toml
        - tox.ini

# Go test
test:go:
  extends: .go
  stage: test
  script:
    - go test -race -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - go.mod

# Rust test
test:rust:
  extends: .rust
  stage: test
  script:
    - cargo test --all
    - cargo test --all -- --nocapture 2>&1 | tail -20
  artifacts:
    reports:
      junit: target/test-results.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Cargo.toml

# Java/Maven test
test:maven:
  extends: .maven
  stage: test
  script:
    - mvn test
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/site/jacoco/jacoco.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - pom.xml

# Java/Gradle test
test:gradle:
  extends: .gradle
  stage: test
  script:
    - gradle test
  coverage: '/TOTAL\s+\d+\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/reports/jacoco/test/jacocoTestReport.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - build.gradle
        - build.gradle.kts

# .NET test
test:dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0-alpine
  before_script:
    - dotnet restore
  script:
    - dotnet test --collect:"XPlat Code Coverage" --results-directory TestResults
  coverage: '/Line coverage\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: TestResults/*/coverage.cobertura.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - "*.csproj"
        - "*.sln"

# PHP test
test:php:
  stage: test
  image: php:8.3-cli-alpine
  before_script:
    - apk add --no-cache bash git curl unzip
    - COMPOSER_INSTALLER="${COMPOSER_INSTALLER:-https://getcomposer.org/installer}"
    - curl -sS "$COMPOSER_INSTALLER" | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist
  script:
    - ./vendor/bin/phpunit --coverage-clover=coverage.xml
  coverage: '/<metrics.*\s+coveredlines="(\d+)"\s+validlines="(\d+)"/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: clover
        path: coverage.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - composer.json

# Ruby test
test:ruby:
  stage: test
  image: ruby:3.3-alpine
  before_script:
    - apk add --no-cache bash git build-base postgresql-dev
    - bundle install --jobs 4 --retry 3
  script:
    - bundle exec rspec --format RspecJunitFormatter --out rspec.xml
  artifacts:
    reports:
      junit: rspec.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Gemfile

# Elixir test
test:elixir:
  stage: test
  image: elixir:1.16-alpine
  before_script:
    - apk add --no-cache bash git
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
  script:
    - mix test --cover
    - mix coveralls.html
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cover/cobertura.xml
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - mix.exs

# Generic test (Makefile)
test:make:
  stage: test
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash git make gcc musl-dev
  script:
    - make test
  artifacts:
    when: always
    expire_in: 30d
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Makefile
        - makefile

# Linting jobs (run in validate stage)
lint:node:
  extends: .node
  stage: validate
  script:
    - npm run lint 2>/dev/null || npx eslint . --ext .js,.ts,.jsx,.tsx 2>/dev/null || echo "No linter configured"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - exists:
        - package.json

lint:python:
  extends: .python
  stage: validate
  script:
    - pip install --no-cache-dir ruff mypy
    - ruff check .
    - mypy . 2>/dev/null || echo "mypy not configured"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - exists:
        - pyproject.toml
        - setup.py
        - requirements.txt

lint:go:
  extends: .go
  stage: validate
  script:
    - go vet ./...
    - golangci-lint run 2>/dev/null || echo "golangci-lint not installed"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - exists:
        - go.mod

lint:rust:
  extends: .rust
  stage: validate
  script:
    - cargo fmt --check
    - cargo clippy -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - exists:
        - Cargo.toml

lint:docker:
  extends: .hadolint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - exists:
        - Dockerfile
        - dockerfile
        - .dockerfile

lint:terraform:
  stage: validate
  image: hashicorp/terraform:1.8
  before_script:
    - apk add --no-cache bash git
  script:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - exists:
        - "*.tf"