# last_verified: 2026-10-25 · git n/a
# GitLab CI Build Stage
# Place in .gitlab/ci/build.yml
#
# Build jobs for various languages and platforms.
# Included by .gitlab-ci.yml

# Node.js build
build:node:
  extends: .node
  stage: build
  script:
    - npm run build 2>/dev/null || echo "No build script defined"
  artifacts:
    paths:
      - dist/
      - build/
      - .next/
      - public/
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - package.json

# Python build (wheel/sdist)
build:python:
  extends: .python
  stage: build
  script:
    - pip install --no-cache-dir build
    - python -m build --wheel --sdist
  artifacts:
    paths:
      - dist/
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - pyproject.toml
        - setup.py

# Go build
build:go:
  extends: .go
  stage: build
  script:
    - go build -ldflags="-s -w" -o bin/app ./...
  artifacts:
    paths:
      - bin/
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - go.mod

# Rust build
build:rust:
  extends: .rust
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Cargo.toml

# Java/Maven build
build:maven:
  extends: .maven
  stage: build
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar
      - target/*.war
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - pom.xml

# Java/Gradle build
build:gradle:
  extends: .gradle
  stage: build
  script:
    - gradle build -x test
  artifacts:
    paths:
      - build/libs/*.jar
      - build/libs/*.war
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - build.gradle
        - build.gradle.kts

# Docker build
build:docker:
  extends: .docker
  stage: build
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$CI_REGISTRY_IMAGE:latest" \
        --tag "$TAG" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        .
    - docker push "$TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Dockerfile
        - dockerfile
        - .dockerfile

# Docker multi-arch build
build:docker-multiarch:
  extends: .docker
  stage: build
  variables:
    DOCKER_BUILDKIT: "1"
  script:
    - |
      docker buildx create --use --name multiarch || docker buildx use multiarch
      TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE:latest" \
        --tag "$TAG" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        --push \
        .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Dockerfile
        - dockerfile
        - .dockerfile
  when: manual

# Generic build (Makefile)
build:make:
  stage: build
  image: alpine:3.19
  before_script:
    - apk add --no-cache bash git make gcc musl-dev
  script:
    - make build
  artifacts:
    paths:
      - bin/
      - build/
      - dist/
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - Makefile
        - makefile

# Helm chart build
build:helm:
  extends: .docker
  stage: build
  before_script:
    - apk add --no-cache bash git curl
    - |
      HELM_VERSION="${HELM_VERSION:-v3.14.0}"
      wget -qO- "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
    - helm version
  script:
    - helm package charts/*
    - helm push *.tgz oci://$CI_REGISTRY/helm
  artifacts:
    paths:
      - "*.tgz"
    expire_in: 1h
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - exists:
        - charts/