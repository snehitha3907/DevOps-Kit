# last_verified: 2026-10-09 · GitHub Actions · n/a
# GitHub Release workflow for Terraform modules.
# Triggers on semantic version tag push (v*.*.* for single-module, */v*.*.* for multi-module).
# Creates a GitHub Release with auto-generated notes.

name: Release

on:
  push:
    tags:
      - "v*.*.*"        # Single-module: v1.0.0, v2.3.4, etc.
      - "*/v*.*.*"      # Multi-module: module-name/v1.0.0

permissions:
  contents: write

jobs:
  # For multi-module repos, extract module name and version from tag
  extract-module:
    name: Extract Module Info
    runs-on: ubuntu-latest
    outputs:
      module-name: ${{ steps.extract.outputs.module }}
      version: ${{ steps.extract.outputs.version }}
      is-multi-module: ${{ steps.extract.outputs.is-multi-module }}
    steps:
      - name: Extract module and version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == */v* ]]; then
            MODULE="${TAG%/v*}"
            VERSION="${TAG#*/}"
            echo "is-multi-module=true" >> "$GITHUB_OUTPUT"
          else
            MODULE=""
            VERSION="${TAG#v}"
            echo "is-multi-module=false" >> "$GITHUB_OUTPUT"
          fi
          echo "module=${MODULE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Module: ${MODULE:-'(single-module)'}, Version: ${VERSION}"

  release:
    name: Create GitHub Release
    needs: extract-module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          name: "${{ needs.extract-module.outputs.module-name != '' && format('{0}/v{1}', needs.extract-module.outputs.module-name, needs.extract-module.outputs.version) || format('v{0}', needs.extract-module.outputs.version) }}"
          tag: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: ${{ needs.extract-module.outputs.is-multi-module == 'true' && format('modules/{0}/CHANGELOG.md', needs.extract-module.outputs.module-name) || 'CHANGELOG.md' }}
          allowUpdates: true
          draft: false
          prerelease: false

      - name: Verify release created
        run: |
          gh release view "${{ github.ref_name }}" --json name,tagName,isDraft,isPrerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}