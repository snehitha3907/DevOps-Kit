# last_verified: 2026-10-09 · GitHub Actions · n/a
# Private Terraform Registry (HCP Terraform / TFE) publishing workflow.
# Uses the Registry Modules API to create/update module versions and upload source.
# Supports both single-module and multi-module (monorepo) repositories.

name: Publish to Private Registry

on:
  push:
    tags:
      - "v*.*.*"
      - "*/v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without 'v' prefix)"
        required: true
        type: string
      module_path:
        description: "Path to module directory (for monorepo)"
        required: false
        type: string
        default: "."

permissions:
  contents: read

env:
  # Configure these as repository variables or update directly
  TFC_ORGANIZATION: "your-organization-name"
  TFC_API_URL: "https://app.terraform.io/api/v2"
  # For Terraform Enterprise, change TFC_API_URL to your TFE hostname, e.g., https://tfe.example.com/api/v2

jobs:
  extract-module:
    name: Extract Module Info
    runs-on: ubuntu-latest
    outputs:
      module-name: ${{ steps.extract.outputs.module }}
      version: ${{ steps.extract.outputs.version }}
      module-path: ${{ steps.extract.outputs.path }}
      provider-name: ${{ steps.extract.outputs.provider }}
      is-multi-module: ${{ steps.extract.outputs.is-multi-module }}
    steps:
      - name: Extract module and version from tag
        id: extract
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            # Manual dispatch
            VERSION="${{ github.event.inputs.version }}"
            MODULE_PATH="${{ github.event.inputs.module_path }}"
            MODULE_NAME=$(basename "$MODULE_PATH")
            IS_MULTI="false"
          else
            # Tag push
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == */v* ]]; then
              MODULE="${TAG%/v*}"
              VERSION="${TAG#*/v}"
              MODULE_PATH="modules/${MODULE}"
              MODULE_NAME="${MODULE}"
              IS_MULTI="true"
            else
              VERSION="${TAG#v}"
              MODULE_PATH="."
              MODULE_NAME="${GITHUB_REPOSITORY#*/}"
              IS_MULTI="false"
            fi
          fi

          # Extract provider from module name (expects format: terraform-<PROVIDER>-<NAME> or <NAME>)
          # Default to 'aws' if not detectable
          if [[ "$MODULE_NAME" == terraform-*-* ]]; then
            PROVIDER=$(echo "$MODULE_NAME" | sed -E 's/^terraform-([^-]+)-.*/\1/')
          elif [[ "$MODULE_NAME" == *-*-* ]]; then
            # Try to extract middle segment as provider
            PROVIDER=$(echo "$MODULE_NAME" | cut -d'-' -f2)
          else
            PROVIDER="aws"
          fi

          echo "module=${MODULE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "path=${MODULE_PATH}" >> "$GITHUB_OUTPUT"
          echo "provider=${PROVIDER}" >> "$GITHUB_OUTPUT"
          echo "is-multi-module=${IS_MULTI}" >> "$GITHUB_OUTPUT"

          echo "Module: ${MODULE_NAME}"
          echo "Version: ${VERSION}"
          echo "Path: ${MODULE_PATH}"
          echo "Provider: ${PROVIDER}"
          echo "Multi-module: ${IS_MULTI}"

  validate:
    name: Validate Module
    needs: extract-module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Validate module structure
        working-directory: ${{ needs.extract-module.outputs.module-path }}
        run: |
          for f in main.tf variables.tf outputs.tf versions.tf README.md; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          if ! grep -q "required_version" versions.tf; then
            echo "::error::versions.tf must declare required_version"
            exit 1
          fi
          if ! grep -q "required_providers" versions.tf; then
            echo "::error::versions.tf must declare required_providers"
            exit 1
          fi

          terraform fmt -check -diff
          terraform init -backend=false
          terraform validate

  publish:
    name: Publish Module Version
    needs: [extract-module, validate]
    runs-on: ubuntu-latest
    env:
      TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
      TFC_ORGANIZATION: ${{ env.TFC_ORGANIZATION }}
      TFC_API_URL: ${{ env.TFC_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify TFE_TOKEN is set
        run: |
          if [[ -z "$TFE_TOKEN" ]]; then
            echo "::error::TFE_TOKEN secret is not set. Add an HCP Terraform API token with registry:write scope."
            exit 1
          fi

      - name: Prepare module source archive
        id: archive
        working-directory: ${{ needs.extract-module.outputs.module-path }}
        run: |
          VERSION="${{ needs.extract-module.outputs.version }}"
          MODULE_NAME="${{ needs.extract-module.outputs.module-name }}"

          # Create a clean archive of the module source
          git archive --format=tar.gz --prefix="${MODULE_NAME}-${VERSION}/" \
            -o "${GITHUB_WORKSPACE}/${MODULE_NAME}-${VERSION}.tar.gz" \
            "refs/tags/${GITHUB_REF_NAME}"

          # Compute SHA256 for attestation
          DIGEST="sha256:$(sha256sum "${GITHUB_WORKSPACE}/${MODULE_NAME}-${VERSION}.tar.gz" | awk '{print $1}')"
          echo "archive_path=${GITHUB_WORKSPACE}/${MODULE_NAME}-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "module_name=${MODULE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create module version via Registry API
        id: create-version
        run: |
          ORG="${TFC_ORGANIZATION}"
          MODULE="${{ steps.archive.outputs.module_name }}"
          PROVIDER="${{ needs.extract-module.outputs.provider-name }}"
          VERSION="${{ needs.extract-module.outputs.version }}"
          COMMIT_SHA="${GITHUB_SHA}"
          API_URL="${TFC_API_URL}"

          AUTH_HEADER="Authorization: Bearer ${TFE_TOKEN}"
          CONTENT_HEADER="Content-Type: application/vnd.api+json"

          # Check if module already exists in registry
          MODULE_RESPONSE=$(curl -sS -X GET \
            -H "$AUTH_HEADER" -H "$CONTENT_HEADER" \
            "${API_URL}/organizations/${ORG}/registry-modules/private/${ORG}/${MODULE}/${PROVIDER}")

          if echo "$MODULE_RESPONSE" | jq -e '.errors' >/dev/null; then
            # Module doesn't exist, create it first
            echo "Module not found in registry. Creating module..."
            CREATE_PAYLOAD=$(jq -n \
              --arg name "$MODULE" \
              --arg provider "$PROVIDER" \
              '{"data": {"type": "registry-modules", "attributes": {"name": $name, "provider": $provider}} }')

            CREATE_RESPONSE=$(curl -sS -X POST \
              -H "$AUTH_HEADER" -H "$CONTENT_HEADER" \
              -d "$CREATE_PAYLOAD" \
              "${API_URL}/organizations/${ORG}/registry-modules/private/${ORG}")

            if echo "$CREATE_RESPONSE" | jq -e '.errors' >/dev/null; then
              echo "::error::Failed to create module in registry"
              echo "$CREATE_RESPONSE" | jq '.errors'
              exit 1
            fi
            echo "Module created successfully."
          fi

          # Create module version
          VERSION_PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg commit_sha "$COMMIT_SHA" \
            '{"data": {"type": "registry-module-versions", "attributes": {"version": $version, "commit_sha": $commit_sha}} }')

          VERSION_RESPONSE=$(curl -sS -X POST \
            -H "$AUTH_HEADER" -H "$CONTENT_HEADER" \
            -d "$VERSION_PAYLOAD" \
            "${API_URL}/organizations/${ORG}/registry-modules/private/${ORG}/${MODULE}/${PROVIDER}/versions")

          if echo "$VERSION_RESPONSE" | jq -e '.errors' >/dev/null; then
            echo "::error::Failed to create module version"
            echo "$VERSION_RESPONSE" | jq '.errors'
            exit 1
          fi

          VERSION_ID=$(echo "$VERSION_RESPONSE" | jq -r '.data.id')
          UPLOAD_URL=$(echo "$VERSION_RESPONSE" | jq -r '.data.links."upload" // empty')

          echo "version_id=${VERSION_ID}" >> "$GITHUB_OUTPUT"
          echo "upload_url=${UPLOAD_URL}" >> "$GITHUB_OUTPUT"

          echo "Module version created: ${VERSION_ID}"
          echo "Upload URL: ${UPLOAD_URL}"

      - name: Upload module source
        run: |
          UPLOAD_URL="${{ steps.create-version.outputs.upload_url }}"
          ARCHIVE_PATH="${{ steps.archive.outputs.archive_path }}"

          if [[ -z "$UPLOAD_URL" || "$UPLOAD_URL" == "null" ]]; then
            echo "::error::No upload URL returned from registry"
            exit 1
          fi

          curl -sS -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${ARCHIVE_PATH}" \
            "$UPLOAD_URL"

          echo "Module source uploaded successfully."

      - name: Verify module version published
        run: |
          ORG="${TFC_ORGANIZATION}"
          MODULE="${{ steps.archive.outputs.module_name }}"
          PROVIDER="${{ needs.extract-module.outputs.provider-name }}"
          VERSION="${{ needs.extract-module.outputs.version }}"
          API_URL="${TFC_API_URL}"
          AUTH_HEADER="Authorization: Bearer ${TFE_TOKEN}"
          CONTENT_HEADER="Content-Type: application/vnd.api+json"

          # Wait a moment for processing
          sleep 5

          VERIFY_RESPONSE=$(curl -sS -X GET \
            -H "$AUTH_HEADER" -H "$CONTENT_HEADER" \
            "${API_URL}/organizations/${ORG}/registry-modules/private/${ORG}/${MODULE}/${PROVIDER}/versions/${VERSION}")

          STATUS=$(echo "$VERIFY_RESPONSE" | jq -r '.data.attributes.status // "unknown"')
          echo "Module version status: ${STATUS}"

          if [[ "$STATUS" != "ready" && "$STATUS" != "pending" ]]; then
            echo "::warning::Module version status is '${STATUS}', not 'ready'. Check HCP Terraform UI for details."
          fi

          # Output registry URL
          REGISTRY_URL="https://app.terraform.io/app/${ORG}/registry/modules/private/${ORG}/${MODULE}/${PROVIDER}/${VERSION}"
          echo "Registry URL: ${REGISTRY_URL}"
          echo "registry_url=${REGISTRY_URL}" >> "$GITHUB_OUTPUT"

      - name: Create build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.archive.outputs.archive_path }}

  notify:
    name: Notify Result
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Success summary
        if: success()
        run: |
          echo "✅ Module published to private registry successfully!"
          echo "Module: ${{ needs.extract-module.outputs.module-name }}"
          echo "Version: ${{ needs.extract-module.outputs.version }}"
          echo "Provider: ${{ needs.extract-module.outputs.provider-name }}"
          echo "Registry: https://app.terraform.io/app/${{ env.TFC_ORGANIZATION }}/registry/modules/private/${{ env.TFC_ORGANIZATION }}/${{ needs.extract-module.outputs.module-name }}/${{ needs.extract-module.outputs.provider-name }}/${{ needs.extract-module.outputs.version }}"

      - name: Failure summary
        if: failure()
        run: |
          echo "❌ Module publishing failed."
          echo "Check the 'Publish Module Version' job logs for details."
          echo "Common issues:"
          echo "  - TFE_TOKEN secret not set or insufficient permissions (needs registry:write)"
          echo "  - TFC_ORGANIZATION variable incorrect"
          echo "  - Module name/provider mismatch with registry"
          echo "  - Version already exists (delete tag and re-tag with new version)"
          echo "  - Network/API errors (re-run workflow)"