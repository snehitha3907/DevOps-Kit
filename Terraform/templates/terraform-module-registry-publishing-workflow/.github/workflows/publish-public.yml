# last_verified: 2026-10-09 · GitHub Actions · n/a
# Public Terraform Registry publishing validation workflow.
# The public Registry uses a GitHub webhook (configured when adding the module via the Registry UI).
# Pushing a valid semantic version tag (v*.*.* or */v*.*.*) automatically triggers the Registry to import the module.
# This workflow validates the module structure before the tag is pushed and confirms the release was created.

name: Validate & Publish (Public Registry)

on:
  push:
    tags:
      - "v*.*.*"
      - "*/v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate (without 'v' prefix)"
        required: true
        type: string
      module_path:
        description: "Path to module directory (for monorepo)"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  validate:
    name: Validate Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: Determine module path
        id: module-path
        run: |
          if [[ -n "${{ github.event.inputs.module_path }}" ]]; then
            echo "path=${{ github.event.inputs.module_path }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == */v* ]]; then
            MODULE="${GITHUB_REF#refs/tags/}"
            MODULE="${MODULE%/v*}"
            echo "path=modules/${MODULE}" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Validate module structure
        working-directory: ${{ steps.module-path.outputs.path }}
        run: |
          # Check required files
          for f in main.tf variables.tf outputs.tf versions.tf README.md; do
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          # Check versions.tf has required_version and required_providers
          if ! grep -q "required_version" versions.tf; then
            echo "::error::versions.tf must declare required_version"
            exit 1
          fi
          if ! grep -q "required_providers" versions.tf; then
            echo "::error::versions.tf must declare required_providers"
            exit 1
          fi

          # Format check
          terraform fmt -check -diff

          # Initialize (no backend needed for validation)
          terraform init -backend=false

          # Validate configuration
          terraform validate

      - name: Run module tests (if present)
        if: always()
        working-directory: ${{ steps.module-path.outputs.path }}
        run: |
          if [[ -d "tests" ]] || [[ -d "test" ]]; then
            echo "Running module tests..."
            # Add your test commands here (e.g., terratest, kitchen-terraform)
          else
            echo "No test directory found, skipping tests."
          fi

  release:
    name: Verify GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Verify release exists
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --json name,tagName,createdAt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Public Registry publishing note
        run: |
          echo "✅ Module validation passed."
          echo "📦 Public Terraform Registry publishing is webhook-driven."
          echo "   The Registry will automatically detect the new tag and import the module."
          echo "   Check https://registry.terraform.io/modules/<namespace>/<name>/<provider> within 1-2 minutes."
          echo "   If the version doesn't appear, use 'Resync Module' in the Registry UI."

  notify:
    name: Notify on Failure
    if: failure()
    needs: [validate, release]
    runs-on: ubuntu-latest
    steps:
      - name: Post failure summary
        run: |
          echo "❌ Validation or release verification failed."
          echo "Check the workflow logs for details."
          echo "Common issues:"
          echo "  - Missing required files (main.tf, variables.tf, outputs.tf, versions.tf, README.md)"
          echo "  - versions.tf missing required_version or required_providers"
          echo "  - terraform fmt -check failed"
          echo "  - terraform validate failed (run 'terraform init' locally first)"