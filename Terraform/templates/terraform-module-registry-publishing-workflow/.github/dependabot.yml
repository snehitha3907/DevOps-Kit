# last_verified: 2026-10-09 · GitHub Actions · n/a
# Dependabot configuration for Terraform modules.
# Place this file at .github/dependabot.yml in your repository.

version: 2
updates:
  # Terraform provider updates
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
    commit-message:
      prefix: "chore"
      prefix-development: "fix"
      include: "scope"
    groups:
      hashicorp-providers:
        patterns:
          - "hashicorp/*"
        update-types:
          - "minor"
          - "patch"
      community-providers:
        patterns:
          - "*/*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version upgrades that may have breaking changes
    ignore:
      - dependency-name: "hashicorp/aws"
        versions: ["6.x"]
      - dependency-name: "hashicorp/azurerm"
        versions: ["4.x"]
      - dependency-name: "hashicorp/google"
        versions: ["6.x"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "actions/*"
          - "hashicorp/*"
        update-types:
          - "minor"
          - "patch"

  # Terraform module source updates (if consuming modules from Registry)
  - package-ecosystem: "terraform"
    directory: "/modules"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "terraform-modules"
    commit-message:
      prefix: "chore"
      include: "scope"