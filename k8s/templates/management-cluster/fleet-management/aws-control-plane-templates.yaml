# last_verified: 2026-10-25 · KubeadmControlPlane v1.7.0
# Purpose: KubeadmControlPlaneTemplate for AWS managed cluster
# When to use: Referenced by aws-managed-cluster ClusterClass
# Prerequisites: CAPA v1.7+, kubeadm bootstrap provider v1.7+
# Verify: kubectl get kubeadmcontrolplanetemplate aws-managed-control-plane -n capi-system -o yaml
# Rollback: kubectl delete kubeadmcontrolplanetemplate aws-managed-control-plane -n capi-system
# Common errors: Version placeholder not substituted; SSH key not configured
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: aws-managed-control-plane
  namespace: capi-system
spec:
  template:
    spec:
      replicas: "${controlPlaneReplicas}"
      version: "${kubernetesVersion}"
      machineTemplate:
        infrastructureRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
          kind: AWSMachineTemplate
          name: aws-control-plane
          namespace: capi-system
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              cloud-provider: external
          controllerManager:
            extraArgs:
              cloud-provider: external
              allocate-node-cidrs: "true"
              configure-cloud-routes: "false"
          dns:
            type: CoreDNS
          etcd:
            local:
              dataDir: /var/lib/etcd
          networking:
            dnsDomain: cluster.local
            podSubnet: 192.168.0.0/16
            serviceSubnet: 10.96.0.0/12
        initConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.hostname }}"
            kubeletExtraArgs:
              cloud-provider: external
              node-labels: "node-role.kubernetes.io/control-plane="
        joinConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.hostname }}"
            kubeletExtraArgs:
              cloud-provider: external
              node-labels: "node-role.kubernetes.io/control-plane="
        files:
          - path: /etc/kubernetes/cloud-config
            owner: "root:root"
            permissions: "0644"
            content: |
              [Global]
              region = ${AWS_REGION}
              vpc = ${vpcId}
              subnet-id = ${privateSubnetIds}
              route-table-id = ${routeTableId}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AWSMachineTemplate
metadata:
  name: aws-control-plane
  namespace: capi-system
spec:
  template:
    spec:
      instanceType: "${controlPlaneMachineType}"
      sshKeyName: "${AWS_SSH_KEY_NAME}"
      iamInstanceProfile: control-plane.cluster-api-provider-aws.sigs.k8s.io
      rootVolume:
        size: 50
        type: gp3
        encryptionKey: "${AWS_KMS_KEY_ARN}"
      additionalSecurityGroups:
        - "${controlPlaneSecurityGroupId}"
      subnet:
        id: "${privateSubnetIds}"
        type: Private