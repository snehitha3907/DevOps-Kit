# last_verified: 2026-10-25 · Cluster API v1.7.0
# Purpose: AWS managed cluster ClusterClass — EKS-style control plane with self-managed EC2 workers
# When to use: Production AWS workload clusters requiring full CAPI lifecycle management
# Prerequisites: CAPA v1.7+ installed, AWS credentials configured, VPC/subnets exist
# Usage: clusterctl generate cluster <name> --from clusterclass/aws-managed-cluster --kubernetes-version v1.29.4
# Verify: kubectl get clusterclass aws-managed-cluster -o yaml
# Rollback: kubectl delete clusterclass aws-managed-cluster
# Common errors: IAM permissions missing; subnet tags not matching CAPA requirements; version skew between CAPI/CAPA
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: aws-managed-cluster
  labels:
    cluster.x-k8s.io/provider: infrastructure-aws
    topology.cluster.x-k8s.io/managed: "true"
spec:
  variables:
    - name: kubernetesVersion
      description: "Kubernetes version for control plane and worker nodes"
      schema:
        type: string
        pattern: "^v?1\\.(2[89]|30)\\.[0-9]+$"
      default: "v1.29.4"
    - name: controlPlaneReplicas
      description: "Number of control plane replicas (must be odd)"
      schema:
        type: integer
        minimum: 1
        maximum: 5
      default: 3
    - name: workerReplicas
      description: "Number of worker node replicas"
      schema:
        type: integer
        minimum: 1
        maximum: 100
      default: 3
    - name: controlPlaneMachineType
      description: "EC2 instance type for control plane nodes"
      schema:
        type: string
        enum: ["m6i.large", "m6i.xlarge", "m6i.2xlarge", "m7i.large", "m7i.xlarge"]
      default: "m6i.large"
    - name: workerMachineType
      description: "EC2 instance type for worker nodes"
      schema:
        type: string
        enum: ["m6i.large", "m6i.xlarge", "m6i.2xlarge", "m7i.large", "m7i.xlarge", "r6i.large", "r6i.xlarge"]
      default: "m6i.large"
    - name: vpcId
      description: "Existing VPC ID for cluster networking"
      schema:
        type: string
        pattern: "^vpc-[0-9a-f]+$"
    - name: privateSubnetIds
      description: "Comma-separated list of private subnet IDs"
      schema:
        type: string
    - name: publicSubnetIds
      description: "Comma-separated list of public subnet IDs (for load balancers)"
      schema:
        type: string
    - name: cni
      description: "CNI plugin to deploy"
      schema:
        type: string
        enum: ["calico", "cilium"]
      default: "calico"
    - name: enableMonitoring
      description: "Deploy Prometheus monitoring stack"
      schema:
        type: boolean
      default: true
    - name: enableLogging
      description: "Deploy Loki logging stack"
      schema:
        type: boolean
      default: true
    - name: enableSecurity
      description: "Deploy Falco runtime security and Kyverno policies"
      schema:
        type: boolean
      default: true
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: AWSClusterTemplate
      name: aws-managed-cluster
    namespace: capi-system
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: aws-managed-control-plane
    namespace: capi-system
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: AWSMachineTemplate
        name: aws-control-plane
      namespace: capi-system
  workers:
    machineDeployments:
      - class: default-worker
        failureDomain: "${failureDomain}"
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: aws-worker-bootstrap
          namespace: capi-system
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: AWSMachineTemplate
            name: aws-worker
          namespace: capi-system