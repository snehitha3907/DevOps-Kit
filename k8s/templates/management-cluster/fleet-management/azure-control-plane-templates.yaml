# last_verified: 2026-10-25 · KubeadmControlPlane v1.7.0
# Purpose: KubeadmControlPlaneTemplate for Azure managed cluster
# When to use: Referenced by azure-managed-cluster ClusterClass
# Prerequisites: CAPZ v1.7+, kubeadm bootstrap provider v1.7+
# Verify: kubectl get kubeadmcontrolplanetemplate azure-managed-control-plane -n capi-system -o yaml
# Rollback: kubectl delete kubeadmcontrolplanetemplate azure-managed-control-plane -n capi-system
# Common errors: Azure cloud provider config missing; managed identity not attached
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: azure-managed-control-plane
  namespace: capi-system
spec:
  template:
    spec:
      replicas: "${controlPlaneReplicas}"
      version: "${kubernetesVersion}"
      machineTemplate:
        infrastructureRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
          kind: AzureMachineTemplate
          name: azure-control-plane
          namespace: capi-system
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              cloud-provider: external
          controllerManager:
            extraArgs:
              cloud-provider: external
              allocate-node-cidrs: "true"
              configure-cloud-routes: "false"
          dns:
            type: CoreDNS
          etcd:
            local:
              dataDir: /var/lib/etcd
          networking:
            dnsDomain: cluster.local
            podSubnet: 10.244.0.0/16
            serviceSubnet: 10.96.0.0/12
        initConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.hostname }}"
            kubeletExtraArgs:
              cloud-provider: external
              node-labels: "node-role.kubernetes.io/control-plane="
        joinConfiguration:
          nodeRegistration:
            name: "{{ ds.meta_data.hostname }}"
            kubeletExtraArgs:
              cloud-provider: external
              node-labels: "node-role.kubernetes.io/control-plane="
        files:
          - path: /etc/kubernetes/azure.json
            owner: "root:root"
            permissions: "0644"
            content: |
              {
                "cloud": "AzurePublicCloud",
                "tenantId": "${AZURE_TENANT_ID}",
                "subscriptionId": "${AZURE_SUBSCRIPTION_ID}",
                "resourceGroup": "${AZURE_RESOURCE_GROUP}",
                "location": "${AZURE_LOCATION}",
                "vnetName": "${vnetName}",
                "vnetResourceGroup": "${vnetResourceGroup}",
                "subnetName": "${controlPlaneSubnetName}",
                "securityGroupName": "${controlPlaneSecurityGroupName}",
                "routeTableName": "${controlPlaneRouteTableName}",
                "cloudProviderBackoff": true,
                "cloudProviderBackoffRetries": 6,
                "cloudProviderBackoffExponent": 1.5,
                "cloudProviderBackoffDuration": 5,
                "cloudProviderBackoffJitter": 1.0
              }
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: AzureMachineTemplate
metadata:
  name: azure-control-plane
  namespace: capi-system
spec:
  template:
    spec:
      vmSize: "${controlPlaneVMSize}"
      image:
        marketplace:
          publisher: cncf-upstream
          offer: kubernetes-ubuntu-2204
          sku: kubernetes-1-29
          version: latest
      osDisk:
        osType: Linux
        diskSizeGB: 128
        managedDisk:
          storageAccountType: Premium_LRS
      sshPublicKey: "${AZURE_SSH_PUBLIC_KEY}"
      subnetName: "${controlPlaneSubnetName}"
      vnetName: "${vnetName}"
      vnetResourceGroup: "${vnetResourceGroup}"
      identity: "${azureClusterIdentity}"