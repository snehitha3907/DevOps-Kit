# Staging overrides — layered on top of group_vars/all.yaml.

---
webserver_listen_port: 8080
webserver_server_name: staging.example.com
dbserver_shared_buffers: "128MB"
dbserver_max_connections: 50
loadbalancer_backend_port: 8080
timezone: UTC
unattended_reboot: false