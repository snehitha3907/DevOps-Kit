# last_verified: 2026-09-16 · Ansible 14.4.0
# Project-level ansible.cfg — picked up automatically when ansible-playbook runs
# from this directory (the closest ansible.cfg to the playbook wins).

[defaults]
# Inventory — two static files, one per environment. Override with -i.
inventory = inventory/production.ini

# Roles live next to the playbooks; no global roles_path needed.
roles_path = roles

# Speed + noise control
host_key_checking = False
retry_files_enabled = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 86400

# Output — YAML is easier to read in logs than the default stdout
stdout_callback = yaml
callbacks_enabled = profile_tasks
display_skipped_hosts = False
display_ok_hosts = True

# Deprecation warnings surface as errors in CI so they get fixed, not ignored.
deprecation_warnings = True
# Collections that declare an incompatible requires_ansible are excluded by default;
# set to ignore to restore the pre-14 behavior.
collections_on_ansible_version_mismatch = exclude

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r