# last_verified: 2026-09-16 · Ansible 14.4.0
# GitHub Actions CI — runs ansible-lint, syntax check, and a dry-run deploy on every
# pull request. Push to main runs the same checks against production inventory.
name: Ansible CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible + ansible-lint + collections
        run: |
          python -m pip install --upgrade pip
          pip install "ansible==14.4.0" ansible-lint
          ansible-galaxy collection install -r group_vars/collections.yml

      - name: ansible-lint
        run: ansible-lint playbooks/

      - name: Syntax check every playbook
        run: |
          for f in playbooks/*.yml; do
            ansible-playbook -i inventory/staging.ini "$f" --syntax-check
          done

      - name: Dry-run deploy to staging
        run: |
          ansible-playbook -i inventory/staging.ini playbooks/site.yml --check --diff