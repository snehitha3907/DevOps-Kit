# last_verified: 2026-09-16 · Ansible 14.4.0
# Production inventory — hostnames are clean, IPs live here.
# Override with -i inventory/staging.ini for staging.

[webservers]
web01-prod ansible_host=10.0.1.10 ansible_user=deploy
web02-prod ansible_host=10.0.1.11 ansible_user=deploy

[dbservers]
db01-prod ansible_host=10.0.2.10 ansible_user=deploy
db02-prod ansible_host=10.0.2.11 ansible_user=deploy

[loadbalancers]
lb01-prod ansible_host=10.0.3.10 ansible_user=deploy

# Derived groups — used by playbooks that target a role, not a literal host list.
[web:children]
webservers

[db:children]
dbservers

[lb:children]
loadbalancers

[production:children]
webservers
dbservers
loadbalancers