# last_verified: 2026-09-16 · Ansible 14.4.0
# Staging inventory — same layout, different IPs. The playbooks never change.

[webservers]
web01-stg ansible_host=10.0.10.10 ansible_user=deploy
web02-stg ansible_host=10.0.10.11 ansible_user=deploy

[dbservers]
db01-stg ansible_host=10.0.20.10 ansible_user=deploy
db02-stg ansible_host=10.0.20.11 ansible_user=deploy

[loadbalancers]
lb01-stg ansible_host=10.0.30.10 ansible_user=deploy

[web:children]
webservers

[db:children]
dbservers

[lb:children]
loadbalancers

[staging:children]
webservers
dbservers
loadbalancers