# last_verified: 2026-09-18 · Ansible n/a
# AWX job template and credential configuration for production GitOps automation.
# A job template stores everything you would pass on the ansible-playbook command line
# (project, playbook, inventory, credentials, extra vars, options) so a launch is one
# click or one API call. Credentials are typed; the type decides the fields collected
# and how they are injected into the job environment.

name: deploy-web-app
description: Deploy the web application from the production GitOps repo
job_type: run
project: gitops-inventory
scm_branch: main
playbook: site.yml
inventory: production
credentials:
  - ssh-credential-deploy
  - vault-credential
  - aws-credential
extra_vars:
  env: production
  app_version: "{{ lookup('env', 'APP_VERSION') | default('latest', true) }}"
forks: 50
limit: web-servers
verbosity: 2
become_enabled: true
allow_simultaneous: true
diff_mode_enabled: true
skip_tags: []
job_tags: deploy

# --- Credentials -------------------------------------------------------------
# AWX credentials are typed. The kind decides what fields are collected and how they
# are injected. Secret fields ("secret": true) are encrypted and written into the job
# environment under names defined by the credential type's injector.
# kinds: Machine (SSH), Vault, Source Control (SCM), Network, Cloud, Token.

ssh-credential-deploy:
  name: ssh-credential-deploy
  credential_type: Machine
  organization: Default
  inputs:
    username: deploy
    ssh_key_data: "{{ lookup('env', 'SSH_DEPLOY_KEY') }}"
    become_method: sudo
    become_username: root

vault-credential:
  name: vault-credential
  credential_type: Vault
  organization: Default
  inputs:
    vault_password: "{{ lookup('env', 'ANSIBLE_VAULT_PASSWORD') }}"

aws-credential:
  name: aws-credential
  credential_type: Amazon Web Services
  organization: Default
  inputs:
    username: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') }}"
    password: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') }}"
    security_token: "{{ lookup('env', 'AWS_SECURITY_TOKEN') }}"