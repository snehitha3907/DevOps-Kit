# last_verified: 2026-10-30 · GCP n/a
gcloud config configurations create production
gcloud config configurations activate production

# Set core project and zone
gcloud config set core project my-gcp-project
gcloud config set core region us-central1

# Set IAM policy for service account
gcloud iam service-accounts add-iam-policy-binding my-service-account@my-gcp-project.iam.gserviceaccount.com \
  --role=roles/storage.objectAdmin

# Set quotas and limits
gcloud compute project-attributes set quota custom-metrics-adapter=100

# Verify configuration
gcloud config configurations list
gcloud auth list