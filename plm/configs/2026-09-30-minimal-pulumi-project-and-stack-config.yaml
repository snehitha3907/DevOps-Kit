# last_verified: 2026-09-30 · pulumi n/a
# Minimal Pulumi project config (the Pulumi.yaml shape) plus a dev stack's
# settings (the Pulumi.dev.yaml shape). Two YAML documents, separated by "---".
---
name: demo
runtime:
  name: python
  options:
    virtualenv: venv
description: Minimal Pulumi program that creates one S3 bucket.
---
# Pulumi.dev.yaml — stack-specific settings for the dev stack.
# Dotted keys under `config` are read back with `pulumi config get <key>`.
config:
  aws:region: us-west-2
  demo:bucket-name: my-first-pulumi-bucket