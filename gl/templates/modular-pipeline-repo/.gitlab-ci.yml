# Modular GitLab CI/CD Pipeline — Root Configuration
# last_verified: 2026-10-21 · GitLab CI/CD 17.4

include:
  - local: '.gitlab/ci/lib.yml'
  - local: '.gitlab/ci/build.yml'
  - local: '.gitlab/ci/test.yml'
  - local: '.gitlab/ci/deploy.yml'

stages:
  - validate
  - build
  - test
  - deploy

variables:
  # Pipeline behavior
  PIPELINE_VERSION: "1.0"
  GIT_DEPTH: "50"
  GIT_STRATEGY: "fetch"

  # Container registry
  REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE/$CI_PROJECT_NAME"
  DOCKER_BUILDKIT: "1"
  DOCKER_TLS_CERTDIR: "/certs"

  # Security scanning
  SAST_ENABLED: "true"
  DEPENDENCY_SCANNING_ENABLED: "true"
  CONTAINER_SCANNING_ENABLED: "true"

  # Deployment
  KUBERNETES_VERSION: "1.29"
  HELM_VERSION: "3.15"

  # Cache
  CACHE_KEY: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
  CACHE_POLICY: "pull-push"

.default:
  image: docker:27.0-cli
  services:
    - name: docker:27.0-dind
      alias: docker
  before_script:
    - apk add --no-cache bash curl jq git openssh-client
    - source .gitlab/ci/helpers.sh || true
  after_script:
    - echo "Job $CI_JOB_NAME completed with status $CI_JOB_STATUS"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
```