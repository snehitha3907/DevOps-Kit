# Deploy Stage — Job Templates
# last_verified: 2026-10-21 · GitLab CI/CD 17.4

# =============================================================================
# Deploy Jobs
# =============================================================================

# Deploy to review environment (for merge requests)
deploy:review:
  extends: .deploy_k8s_template
  variables:
    DEPLOY_ENVIRONMENT: "review-${CI_MERGE_REQUEST_IID}"
    NAMESPACE: "${CI_PROJECT_NAME}-review-${CI_MERGE_REQUEST_IID}"
    DEPLOY_URL: "https://review-${CI_MERGE_REQUEST_IID}.${CI_PROJECT_NAME}.${BASE_DOMAIN}"
  environment:
    name: review/${CI_MERGE_REQUEST_IID}
    url: https://review-${CI_MERGE_REQUEST_IID}.${CI_PROJECT_NAME}.${BASE_DOMAIN}
    on_stop: stop:review
    auto_stop_in: "1 week"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  tags:
    - deploy

# Stop review environment
stop:review:
  extends: .kubectl_environment
  stage: deploy
  variables:
    DEPLOY_ENVIRONMENT: "review-${CI_MERGE_REQUEST_IID}"
    NAMESPACE: "${CI_PROJECT_NAME}-review-${CI_MERGE_REQUEST_IID}"
  script:
    - echo "Stopping review environment ${CI_MERGE_REQUEST_IID}..."
    - kubectl delete namespace "$NAMESPACE" --ignore-not-found=true
  environment:
    name: review/${CI_MERGE_REQUEST_IID}
    action: stop
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  tags:
    - deploy

# Deploy to staging
deploy:staging:
  extends: .deploy_k8s_template
  variables:
    DEPLOY_ENVIRONMENT: "staging"
    NAMESPACE: "${CI_PROJECT_NAME}-staging"
    DEPLOY_URL: "https://staging.${CI_PROJECT_NAME}.${BASE_DOMAIN}"
  environment:
    name: staging
    url: https://staging.${CI_PROJECT_NAME}.${BASE_DOMAIN}
  rules:
    - *only_default_branch
  tags:
    - deploy

# Deploy to production (manual approval required)
deploy:production:
  extends: .deploy_production_template
  variables:
    PRODUCTION_URL: "https://${CI_PROJECT_NAME}.${BASE_DOMAIN}"
  environment:
    name: production
    url: https://${CI_PROJECT_NAME}.${BASE_DOMAIN}
  rules:
    - *only_tags
  tags:
    - deploy

# Canary deployment to production
deploy:canary:
  extends: .kubectl_environment
  stage: deploy
  image: bitnami/kubectl:1.29
  variables:
    DEPLOY_ENVIRONMENT: "production"
    NAMESPACE: "${CI_PROJECT_NAME}-production"
    CANARY_WEIGHT: "10"
    HELM_RELEASE: "${CI_PROJECT_NAME}-canary"
    HELM_CHART: "./charts/${CI_PROJECT_NAME}"
  environment:
    name: production/canary
    url: https://canary.${CI_PROJECT_NAME}.${BASE_DOMAIN}
  script:
    - |
      echo "Deploying canary (${CANARY_WEIGHT}% traffic)..."
      kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
      if [ -f "$HELM_CHART/Chart.yaml" ]; then
        helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
          --namespace "$NAMESPACE" \
          --create-namespace \
          --wait --timeout 5m \
          --set image.repository="${REGISTRY_IMAGE}" \
          --set image.tag="${CI_COMMIT_SHA}" \
          --set replicaCount=1 \
          --set canary.enabled=true \
          --set canary.weight="${CANARY_WEIGHT}"
      else
        kubectl apply -k "k8s/overlays/production-canary" --namespace "$NAMESPACE"
      fi
    - echo "Canary deployed. Monitor metrics before promoting."
  when: manual
  rules:
    - *only_tags
  tags:
    - deploy

# Promote canary to full production
deploy:promote-canary:
  extends: .kubectl_environment
  stage: deploy
  image: bitnami/kubectl:1.29
  variables:
    DEPLOY_ENVIRONMENT: "production"
    NAMESPACE: "${CI_PROJECT_NAME}-production"
    HELM_RELEASE: "${CI_PROJECT_NAME}"
    HELM_CHART: "./charts/${CI_PROJECT_NAME}"
  script:
    - |
      echo "Promoting canary to full production..."
      if [ -f "$HELM_CHART/Chart.yaml" ]; then
        helm upgrade --install "$HELM_RELEASE" "$HELM_CHART" \
          --namespace "$NAMESPACE" \
          --wait --timeout 5m \
          --set image.repository="${REGISTRY_IMAGE}" \
          --set image.tag="${CI_COMMIT_SHA}" \
          --set canary.enabled=false
        helm uninstall "${CI_PROJECT_NAME}-canary" -n "$NAMESPACE" || true
      else
        kubectl apply -k "k8s/overlays/production" --namespace "$NAMESPACE"
      fi
    - echo "Promotion complete. Verifying rollout..."
    - kubectl rollout status deployment/"$HELM_RELEASE" -n "$NAMESPACE" --timeout=300s
  when: manual
  rules:
    - *only_tags
  tags:
    - deploy

# Rollback production deployment
deploy:rollback:
  extends: .kubectl_environment
  stage: deploy
  image: bitnami/kubectl:1.29
  variables:
    DEPLOY_ENVIRONMENT: "production"
    NAMESPACE: "${CI_PROJECT_NAME}-production"
    HELM_RELEASE: "${CI_PROJECT_NAME}"
  environment:
    name: production
    action: rollback
  script:
    - |
      echo "Rolling back production deployment..."
      if helm list -n "$NAMESPACE" | grep -q "$HELM_RELEASE"; then
        helm rollback "$HELM_RELEASE" -n "$NAMESPACE"
      else
        kubectl rollout undo deployment/"$HELM_RELEASE" -n "$NAMESPACE"
      fi
    - echo "Rollback complete. Verifying rollout..."
    - kubectl rollout status deployment/"$HELM_RELEASE" -n "$NAMESPACE" --timeout=300s
  when: manual
  rules:
    - *only_tags
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags:
    - deploy

# Deploy with ArgoCD (GitOps)
deploy:argocd:
  extends: .kubectl_environment
  stage: deploy
  image: argoproj/argocd:latest
  variables:
    ARGOCD_SERVER: "argocd.${BASE_DOMAIN}"
    ARGOCD_APP: "${CI_PROJECT_NAME}"
  script:
    - |
      echo "Syncing ArgoCD application ${ARGOCD_APP}..."
      argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_TOKEN" --insecure
      argocd app sync "$ARGOCD_APP" --prune --self-heal
      argocd app wait "$ARGOCD_APP" --health --timeout 300
  when: manual
  rules:
    - *only_default_branch
    - *only_tags
  tags:
    - deploy

# Deploy Helm chart to registry
deploy:helm-registry:
  extends: .helm_environment
  stage: deploy
  script:
    - |
      for chart in charts/*/; do
        if [ -f "${chart}Chart.yaml" ]; then
          CHART_NAME=$(basename "$chart")
          CHART_VERSION=$(grep '^version:' "${chart}Chart.yaml" | awk '{print $2}' | tr -d '"')
          echo "Publishing $CHART_NAME v$CHART_VERSION to OCI registry..."
          helm package "$chart" --destination .helm-packages/
          helm push ".helm-packages/${CHART_NAME}-${CHART_VERSION}.tgz" oci://${CI_REGISTRY}/helm
        fi
      done
  rules:
    - *only_tags
  tags:
    - deploy

# Deploy infrastructure (Terraform)
deploy:terraform:
  <<: *job_base
  stage: deploy
  image: hashicorp/terraform:1.9
  variables:
    TF_ROOT: "terraform"
    TF_VAR_environment: "${DEPLOY_ENVIRONMENT:-staging}"
  before_script:
    - *job_base.before_script
    - |
      if [ -n "$TF_STATE_BUCKET" ]; then
        cat > backend.tf <<EOF
        terraform {
          backend "s3" {
            bucket = "${TF_STATE_BUCKET}"
            key    = "${CI_PROJECT_NAME}/${TF_VAR_environment}/terraform.tfstate"
            region = "${AWS_REGION:-us-east-1}"
            dynamodb_table = "${TF_LOCK_TABLE:-terraform-locks}"
            encrypt = true
          }
        }
        EOF
      fi
  script:
    - cd "$TF_ROOT"
    - terraform init -input=false
    - terraform validate
    - terraform plan -input=false -out=tfplan
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        terraform show -json tfplan | tee plan.json
      else
        terraform apply -input=false -auto-approve tfplan
      fi
  artifacts:
    paths:
      - terraform/tfplan
      - terraform/plan.json
    expire_in: "1 week"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - deploy

# Blue-green deployment
deploy:blue-green:
  extends: .kubectl_environment
  stage: deploy
  image: bitnami/kubectl:1.29
  variables:
    DEPLOY_ENVIRONMENT: "production"
    NAMESPACE: "${CI_PROJECT_NAME}-production"
    ACTIVE_COLOR: "blue"
    INACTIVE_COLOR: "green"
    HELM_RELEASE: "${CI_PROJECT_NAME}"
    HELM_CHART: "./charts/${CI_PROJECT_NAME}"
  script:
    - |
      echo "Executing blue-green deployment..."
      # Determine inactive color
      CURRENT=$(kubectl get service "$HELM_RELEASE" -n "$NAMESPACE" -o jsonpath='{.metadata.labels.color}' 2>/dev/null || echo "blue")
      if [ "$CURRENT" = "blue" ]; then
        ACTIVE_COLOR="green"
        INACTIVE_COLOR="blue"
      fi
      echo "Current: $CURRENT, Deploying to: $ACTIVE_COLOR"
      # Deploy to inactive color
      helm upgrade --install "${HELM_RELEASE}-${ACTIVE_COLOR}" "$HELM_CHART" \
        --namespace "$NAMESPACE" \
        --create-namespace \
        --wait --timeout 5m \
        --set image.repository="${REGISTRY_IMAGE}" \
        --set image.tag="${CI_COMMIT_SHA}" \
        --set color="${ACTIVE_COLOR}"
      # Verify inactive color
      kubectl rollout status deployment/"${HELM_RELEASE}-${ACTIVE_COLOR}" -n "$NAMESPACE" --timeout=300s
      # Switch traffic
      kubectl patch service "$HELM_RELEASE" -n "$NAMESPACE" -p "{\"spec\":{\"selector\":{\"app\":\"${HELM_RELEASE}\",\"color\":\"${ACTIVE_COLOR}\"}}}"
      echo "Traffic switched to $ACTIVE_COLOR. Monitor before cleaning up $INACTIVE_COLOR."
  when: manual
  rules:
    - *only_tags
  tags:
    - deploy
