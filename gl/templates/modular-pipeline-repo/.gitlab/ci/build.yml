# Build Stage — Job Templates
# last_verified: 2026-10-21 · GitLab CI/CD 17.4

# =============================================================================
# Build Jobs
# =============================================================================

# Docker image build (single platform)
build:docker:
  extends: .docker_build_template
  variables:
    DOCKERFILE: "Dockerfile"
    BUILD_CONTEXT: "."
  rules:
    - *only_default_branch
    - *only_merge_requests
    - *only_tags
    - *only_schedules
  tags:
    - docker

# Multi-platform Docker build (buildx)
build:docker:multiarch:
  extends: .docker_buildx_template
  variables:
    DOCKERFILE: "Dockerfile"
    BUILD_CONTEXT: "."
    PLATFORMS: "linux/amd64,linux/arm64"
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - docker
  resource_limits:
    <<: *resource_limits_large
  timeout: "90m"

# Build with Kaniko (for environments without Docker daemon)
build:kaniko:
  <<: *job_base
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.0-debug
    entrypoint: [""]
  variables:
    DOCKERFILE: "Dockerfile"
    BUILD_CONTEXT: "."
    KANIKO_ARGS: "--cache=true --cache-ttl=48h"
  before_script:
    - |
      if [ -n "$CI_REGISTRY_USER" ]; then
        mkdir -p /kaniko/.docker
        cat > /kaniko/.docker/config.json <<EOF
        {
          "auths": {
            "$CI_REGISTRY": {
              "username": "$CI_REGISTRY_USER",
              "password": "$CI_REGISTRY_PASSWORD"
            }
          }
        }
        EOF
      fi
  script:
    - |
      BUILD_TAGS="${REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        BUILD_TAGS="${BUILD_TAGS},${REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        BUILD_TAGS="${BUILD_TAGS},${REGISTRY_IMAGE}:latest"
      fi
      echo "Building with Kaniko, tags: $BUILD_TAGS"
      /kaniko/executor \
        --context "$BUILD_CONTEXT" \
        --dockerfile "$DOCKERFILE" \
        --destination "$BUILD_TAGS" \
        --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
        --build-arg VCS_REF="${CI_COMMIT_SHA}" \
        --build-arg VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" \
        $KANIKO_ARGS
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - kaniko

# Build Helm chart package
build:helm:
  extends: .helm_lint_template
  stage: build
  script:
    - |
      for chart in charts/*/; do
        if [ -f "${chart}Chart.yaml" ]; then
          echo "Packaging $chart"
          helm package "$chart" --destination .helm-packages/
          helm push "$(ls -t .helm-packages/*.tgz | head -1)" oci://${CI_REGISTRY}/helm
        fi
      done
  artifacts:
    paths:
      - .helm-packages/*.tgz
    expire_in: "1 week"
  rules:
    - *only_default_branch
    - *only_tags

# Build documentation
build:docs:
  <<: *job_base
  stage: build
  image: node:22-alpine
  script:
    - |
      if [ -f "package.json" ] && grep -q '"docs"' package.json; then
        npm ci --cache .cache/npm
        npm run docs:build
      elif [ -f "mkdocs.yml" ]; then
        pip install mkdocs-material --cache-dir .cache/pip
        mkdocs build --site-dir public
      elif [ -f "docs/conf.py" ]; then
        pip install sphinx sphinx-rtd-theme --cache-dir .cache/pip
        sphinx-build -b html docs public
      else
        echo "No documentation build configuration found"
        exit 0
      fi
  artifacts:
    paths:
      - public/
    expire_in: "1 week"
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  cache:
    <<: *cache_pull

# Compile/produce language-specific artifacts
build:artifact:
  <<: *job_base
  stage: build
  script:
    - |
      if [ -f "Makefile" ] && grep -q "^build:" Makefile; then
        make build
      elif [ -f "package.json" ]; then
        npm ci --cache .cache/npm && npm run build
      elif [ -f "pyproject.toml" ]; then
        pip install build --cache-dir .cache/pip
        python -m build --wheel --sdist
      elif [ -f "go.mod" ]; then
        go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o bin/app ./cmd/...
      elif [ -f "Cargo.toml" ]; then
        cargo build --release
      else
        echo "No recognized build configuration found"
        exit 0
      fi
  artifacts:
    paths:
      - bin/
      - dist/
      - target/release/
      - *.whl
      - *.tar.gz
    expire_in: "1 week"
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  cache:
    <<: *cache_pull
