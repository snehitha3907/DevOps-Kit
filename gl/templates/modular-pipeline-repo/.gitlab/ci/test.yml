# Test Stage — Job Templates
# last_verified: 2026-10-21 · GitLab CI/CD 17.4

# =============================================================================
# Test Jobs
# =============================================================================

# Unit tests (extends shared template)
test:unit:
  extends: .unit_test_template
  rules:
    - *only_default_branch
    - *only_merge_requests
    - *only_tags
    - *only_schedules
  tags:
    - test

# Integration tests
test:integration:
  extends: .integration_test_template
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - test

# End-to-end tests
test:e2e:
  <<: *job_base
  stage: test
  image: node:22-alpine
  variables:
    TEST_ENV: "e2e"
    CYPRESS_BASE_URL: "http://localhost:3000"
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  before_script:
    - *job_base.before_script
    - npm ci --cache .cache/npm
    - npx cypress install
  script:
    - |
      if [ -f "cypress.config.js" ] || [ -f "cypress.config.ts" ]; then
        npm run build 2>/dev/null || true
        npm run start & sleep 10
        npx cypress run --reporter junit --reporter-options "mochaFile=cypress-results.xml"
      elif [ -f "playwright.config.js" ] || [ -f "playwright.config.ts" ]; then
        npx playwright install --with-deps chromium
        npm run build 2>/dev/null || true
        npm run start & sleep 10
        npx playwright test --reporter=junit
      else
        echo "No E2E test configuration found (Cypress or Playwright)"
        exit 0
      fi
  artifacts:
    reports:
      junit: cypress-results.xml
    expire_in: "1 week"
  allow_failure: true
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - test

# Static Application Security Testing (SAST)
test:sast:
  extends: .sast_template
  tags:
    - sast

# Dependency scanning
test:dependency-scan:
  extends: .dependency_scan_template
  tags:
    - sast

# Container scanning
test:container-scan:
  extends: .container_scan_template
  tags:
    - sast

# Secret detection
test:secret-detection:
  <<: *job_base
  stage: test
  image: registry.gitlab.com/gitlab-org/security-products/secret-detection:v5.0.0
  script:
    - /analyzer run
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    expire_in: "1 month"
  allow_failure: true
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - sast

# Infrastructure as Code scanning (Checkov)
test:iac-scan:
  <<: *job_base
  stage: test
  image: bridgecrew/checkov:3.2.0
  script:
    - |
      echo "Running IaC scan with Checkov..."
      checkov -d . --framework terraform,kubernetes,helm,arm,bicep,cloudformation \
        --output json --output-file-path checkov-report.json \
        --quiet --compact \
        --skip-check CKV_DOCKER_3,CKV_K8S_21
  artifacts:
    reports:
      sast: checkov-report.json
    expire_in: "1 month"
  allow_failure: true
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - test

# License compliance scanning
test:license-scan:
  <<: *job_base
  stage: test
  image: fossa/cli:latest
  script:
    - |
      if [ -n "$FOSSA_API_KEY" ]; then
        fossa analyze --output-format json --output-file fossa-report.json
      else
        echo "FOSSA_API_KEY not set, skipping license scan"
        exit 0
      fi
  artifacts:
    reports:
      license_scanning: fossa-report.json
    expire_in: "1 month"
  allow_failure: true
  rules:
    - *only_default_branch
    - *only_tags
    - *only_schedules
  tags:
    - test

# Performance/load testing
test:performance:
  <<: *job_base
  stage: test
  image: grafana/k6:latest
  script:
    - |
      if [ -f "k6-script.js" ] || [ -f "load-test.js" ]; then
        k6 run --out json=performance-report.json k6-script.js
      else
        echo "No k6 load test script found"
        exit 0
      fi
  artifacts:
    reports:
      performance: performance-report.json
    expire_in: "1 week"
  allow_failure: true
  rules:
    - *only_tags
    - *only_schedules
  tags:
    - test

# Kubernetes manifest validation
test:kubeval:
  extends: .kubeval_template
  tags:
    - test

# Helm chart linting
test:helm-lint:
  extends: .helm_lint_template
  tags:
    - test

# Code quality / linting
test:lint:
  <<: *job_base
  stage: test
  script:
    - |
      if [ -f ".golangci.yml" ] || [ -f ".golangci.yaml" ]; then
        golangci-lint run --out-format=json --out-file=golangci-report.json
      elif [ -f "pyproject.toml" ] && grep -q "ruff\|flake8\|pylint" pyproject.toml; then
        pip install ruff --cache-dir .cache/pip && ruff check --output-format=json . > ruff-report.json || true
      elif [ -f "package.json" ] && grep -q '"lint"' package.json; then
        npm ci --cache .cache/npm && npm run lint -- --format=json > eslint-report.json || true
      elif [ -f "Makefile" ] && grep -q "^lint:" Makefile; then
        make lint
      else
        echo "No lint configuration found"
        exit 0
      fi
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    expire_in: "1 week"
  allow_failure: true
  rules:
    - *only_default_branch
    - *only_merge_requests
    - *only_tags
    - *only_schedules
  tags:
    - test
```