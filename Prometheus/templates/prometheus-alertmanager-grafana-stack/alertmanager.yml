# last_verified: 2026-10-19 · Alertmanager n/a
# Alertmanager configuration for the monitoring stack.
# Route tree, receivers, inhibition rules, and templates.
global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST:-localhost:25}"
  smtp_from: "${SMTP_FROM:-alertmanager@localhost}"
  smtp_auth_username: "${SMTP_USERNAME:-}"
  smtp_auth_password: "${SMTP_PASSWORD:-}"

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "cluster", "environment"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "default"
  routes:
    - match:
        severity: "critical"
      receiver: "critical-alerts"
      continue: true
    - match:
        severity: "warning"
      receiver: "warning-alerts"
      continue: true

receivers:
  - name: "default"
    webhook_configs:
      - url: "${ALERTMANAGER_WEBHOOK_URL:-http://localhost:5001/webhook}"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://localhost:5002/critical}"
        send_resolved: true
    # Email configuration (requires SMTP settings in global section)
    # email_configs:
    #   - to: "${ALERT_EMAIL:-oncall@example.com}"
    #     send_resolved: true

  - name: "warning-alerts"
    webhook_configs:
      - url: "${ALERTMANAGER_WARNING_WEBHOOK_URL:-http://localhost:5003/warning}"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance", "cluster", "environment"]

  - source_match:
      alertname: "InstanceDown"
    target_match_re:
      alertname: ".*"
    equal: ["instance", "cluster", "environment"]

  - source_match:
      alertname: "PrometheusTargetDown"
    target_match_re:
      alertname: ".*"
    equal: ["cluster", "environment"]