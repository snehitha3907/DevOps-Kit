# last_verified: 2026-10-04 · Helm · n/a
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "microservice-chart.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  # Re-rendering this Secret on every `helm upgrade` rotates the generated
  # password, so a StatefulSet that reads it from the Secret gets the new value
  # only after a restart. That is exactly why auth.password should be set
  # explicitly outside a throwaway cluster.
  postgres-password: {{ include "postgresql.password" . | quote }}
  database: {{ .Values.auth.database | quote }}
  username: {{ .Values.auth.username | quote }}
